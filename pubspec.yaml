name: ether_cinema
description: "Ether Cinema - Premium Cinematic 3D Streaming App built from Stitch design"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  firebase_core: ^3.0.0 # Just let flutter pub get resolve
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.2.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10
  permission_handler: ^12.0.3
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
